name: Build Native Tools

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-axtool:
    name: Build axtool (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build axtool
        working-directory: native/axtool
        run: swift build -c release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: axtool-macos-arm64
          path: native/axtool/.build/release/axtool

  build-uia:
    name: Build uia.exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish uia.exe
        run: dotnet publish native/uia-tool/uia-tool.csproj -c Release -o native/uia-tool/publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uia-windows-x64
          path: native/uia-tool/publish/uia.exe

  release:
    name: Create Release
    needs: [build-axtool, build-uia]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/axtool-macos-arm64/axtool
            artifacts/uia-windows-x64/uia.exe
          generate_release_notes: true
